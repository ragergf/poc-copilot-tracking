name: Label Copilot PRs

on:
  pull_request:
    types:
      - opened
      - reopened

permissions:
  issues: write
  pull-requests: write

jobs:
  label-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Label and comment on Copilot PRs
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const author = pullRequest.user?.login;
            const labelName = '🤖 copilot-agent';

            if (!['github-copilot[bot]', 'Copilot'].includes(author)) {
              core.info(`Skipping PR from ${author ?? 'unknown author'}.`);
              return;
            }

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
                color: '0075ca',
                description: 'Labels GitHub Copilot agent pull requests.',
              });
            }

            const table = [
              '| author | created_at | branch | commits | additions | deletions |',
              '| --- | --- | --- | ---: | ---: | ---: |',
              `| ${author} | ${pullRequest.created_at} | ${pullRequest.head.ref} | ${pullRequest.commits} | ${pullRequest.additions} | ${pullRequest.deletions} |`,
            ].join('\n');

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              labels: [labelName],
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              body: `🤖 Copilot agent PR detected.\n\n${table}`,
            });
